# Deterministic benchmark flow for Flashlight.
# Runs the in-app scripted benchmark, which navigates Static -> theme toggles ->
# Dynamic on its own. Keep this flow identical on the v2 and v3 branches so the
# Flashlight FPS/CPU/RAM reports are directly comparable.
#
# Run with:
#   flashlight test --bundleId com.anonymous.unistylesperf \
#     --testCommand "maestro test .maestro/benchmark.yaml" \
#     --duration 30000 --resultsFilePath ./flashlight-v2.json
appId: com.anonymous.unistylesperf
---
- launchApp:
    clearState: false
- tapOn:
    id: 'control-run-benchmark'
# The in-app runner drives Static screen, 5 theme toggles, then the Dynamic
# screen (~5s). Wait it out so Flashlight captures the full sequence.
- extendedWaitUntil:
    visible:
      id: 'report-output'
    timeout: 20000
