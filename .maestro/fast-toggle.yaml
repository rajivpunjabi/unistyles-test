# Fast toggle-theme perf flow for Flashlight (stress).
# Identical to toggle-theme.yaml but with only a 50ms delay between taps, to
# stress how rapidly successive theme switches coalesce/queue. Taps 10x on
# Static, then 10x on Nested. Same testIDs on the v2 and v3 branches.
#
# waitToSettleTimeoutMs: 0 -> don't wait for the UI to go idle after a tap. On v2
# a theme toggle re-renders many components; the default settle-wait stalls on a
# slow physical device. The tapOn `delay` paces the toggles instead.
appId: com.anonymous.unistylesperf
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'control-theme-toggle'
    timeout: 30000
- tapOn:
    id: 'control-theme-toggle'
    repeat: 10
    delay: 50
    waitToSettleTimeoutMs: 0
- tapOn:
    text: 'Nested'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'nested-theme'
    timeout: 30000
- tapOn:
    id: 'nested-theme'
    repeat: 10
    delay: 50
    waitToSettleTimeoutMs: 0
