# Toggle-theme perf flow for Flashlight (paced).
# Taps the theme toggle 10x on the Static screen, then 10x on the Nested screen,
# with a 300ms delay between taps (tapOn repeat/delay). Same testIDs on the v2
# and v3 branches so the two APKs run the identical flow.
#
# waitToSettleTimeoutMs: 0 -> don't wait for the UI to go idle after a tap. On v2
# a theme toggle re-renders many components; the default settle-wait stalls on a
# slow physical device. The tapOn `delay` paces the toggles instead.
appId: com.anonymous.unistylesperf
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'control-theme-toggle'
    timeout: 30000
- tapOn:
    id: 'control-theme-toggle'
    repeat: 10
    delay: 300
    waitToSettleTimeoutMs: 0
- tapOn:
    text: 'Nested'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'nested-theme'
    timeout: 30000
- tapOn:
    id: 'nested-theme'
    repeat: 10
    delay: 300
    waitToSettleTimeoutMs: 0
